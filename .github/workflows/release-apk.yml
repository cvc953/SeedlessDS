name: Build Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: seedlessds-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 90

    - name: Print artifact URLs
      run: |
        echo "Release APK artifacts have been uploaded."
        echo "To download them, go to: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"