name: Build Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Accept SDK licenses
      run: |
        # Accept all SDK licenses needed for builds
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

    - name: Set up Android SDK PATH
      run: |
        ANDROID_SDK_ROOT=$HOME/Android/Sdk
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_CMDLINE=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_ENV
        export ANDROID_SDK_ROOT
        export ANDROID_CMDLINE
        chmod +x $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
        chmod +x $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager

    - name: Set up NDK path
      run: |
        # NDK is typically bundled or available at standard paths
        ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653
        if [ -d "$ANDROID_NDK_ROOT" ]; then
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
        else
          # Try to find NDK
          NDK_PATH=$(find $ANDROID_SDK_ROOT -name "ndk-* " -type d 2>/dev/null | head -1)
          if [ -d "$NDK_PATH" ]; then
            echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          fi
        fi
        export ANDROID_NDK_ROOT

    - name: Set up CMake path
      run: |
        ANDROID_CMAKE_ROOT=$ANDROID_SDK_ROOT/cmake/3.22.1
        if [ -d "$ANDROID_CMAKE_ROOT" ]; then
          echo "ANDROID_CMAKE_ROOT=$ANDROID_CMAKE_ROOT" >> $GITHUB_ENV
        else
          # Try alternative paths
          CMAKE_PATH=$(find $ANDROID_SDK_ROOT -name "cmake" -type d -maxdepth 4 2>/dev/null | head -1)
          if [ -d "$CMAKE_PATH" ]; then
            echo "ANDROID_CMAKE_ROOT=$CMAKE_PATH" >> $GITHUB_ENV
          fi
        fi
        export ANDROID_CMAKE_ROOT

    - name: Set up PATH for build tools
      run: |
        ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
        export PATH=$ANDROID_SDK_ROOT/platform-tools:$PATH
        if [ -n "$ANDROID_NDK_ROOT" ]; then
          export PATH=$ANDROID_NDK_ROOT:$PATH
        fi
        if [ -n "$ANDROID_CMAKE_ROOT" ]; then
          export PATH=$ANDROID_CMAKE_ROOT/bin:$PATH
        fi
        export PATH
        echo "PATH=$PATH"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      # Build with release signing if credentials available, otherwise debug
      run: |
        if [ -n "$RELEASE_STORE_FILE" ]; then
          echo "storeFile=file://${RELEASE_STORE_FILE}" > local.properties
          echo "storePassword=${RELEASE_STORE_PASSWORD}" >> local.properties
          echo "keyAlias=${RELEASE_KEY_ALIAS}" >> local.properties
          echo "keyPassword=${RELEASE_KEY_PASSWORD}" >> local.properties
          ./gradlew assembleRelease
        else
          ./gradlew assembleDebug
        fi

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: seedlessds-apk
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk
        retention-days: 90

    - name: Print build status
      run: |
        echo "Build completed."
        echo "APK artifacts are available in the Actions tab."
        if [ -n "$RELEASE_STORE_FILE" ]; then
          echo "Release build with signing was performed."
        else
          echo "Debug build was performed (no release signing secrets provided)."
        fi