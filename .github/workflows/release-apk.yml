name: Build Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Android SDK
      uses: actions/setup-android@v3
      with:
        api-level: 35
        ndk: '25.2.9519653'
        cmake: '3.22.1'

    - name: Accept licenses
      run: yes | sdkmanager --licenses

    - name: Set up JDK 17 for Kotlin
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Configure release signing (optional)
      # Create keystore file from secret if provided
      run: |
        if [ -n "${{ secrets.RELEASE_STORE_FILE }}" ] && [ -n "${{ secrets.RELEASE_KEY_ALIAS }}" ] && [ -n "${{ secrets.RELEASE_STORE_PASSWORD }}" ] && [ -n "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
          echo "RELEASE_STORE_FILE_BASE64=${{ secrets.RELEASE_STORE_FILE }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "Release signing credentials provided."
        else
          echo "No release signing credentials found - building with debug signing for artifact preview."
          echo "To enable release signing, add these GitHub secrets:"
          echo "  - RELEASE_STORE_FILE (base64-encoded keystore)"
          echo "  - RELEASE_KEY_ALIAS"
          echo "  - RELEASE_STORE_PASSWORD"
          echo "  - RELEASE_KEY_PASSWORD"
        fi

    - name: Build Release APK
      # If release signing credentials are available, use them; otherwise use debug signing
      run: |
        if [ -n "$RELEASE_STORE_FILE" ]; then
          echo "storeFile=file://${RELEASE_STORE_FILE_BASE64}" > local.properties
          echo "storePassword=${RELEASE_STORE_PASSWORD}" >> local.properties
          echo "keyAlias=${RELEASE_KEY_ALIAS}" >> local.properties
          echo "keyPassword=${RELEASE_KEY_PASSWORD}" >> local.properties
          ./gradlew assembleRelease
        else
          ./gradlew assembleDebug
        fi

    - name: Upload Release APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: seedlessds-release-apk
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk
        retention-days: 90

    - name: Print artifact availability
      run: |
        echo "Build completed successfully."
        echo "Artifacts are available for download in the Actions tab."
        echo "For full release builds with signing, configure GitHub secrets as described."